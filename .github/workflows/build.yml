name: SonarQube

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    types: [opened, synchronize, reopened]


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    # Base MySQL temporaire pour les tests d'intégration
    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: cinema_test
          MYSQL_USER: cinema_test_user
          MYSQL_PASSWORD: cinema_test_password
          MYSQL_ROOT_PASSWORD: root_test_password

        ports:
          - 3306:3306

        # Attend que MySQL soit opérationnel
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          # Identifiants du serveur MySQL temporaire
          TEST_DB_USERNAME: cinema_test_user
          TEST_DB_PASSWORD: cinema_test_password

        run: >
          mvn -B clean verify -P integration-mysql
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=AurelDaddy_le-grande-cinema
