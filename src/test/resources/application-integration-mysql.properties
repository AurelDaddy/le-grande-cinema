
# Configuration des tests d'intégration MySQL
# Base locale dédiée aux tests - ne jamais utiliser en production

spring.datasource.url=jdbc:mysql://localhost:3306/cinema_test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Identifiants fournis par les variables d'environnement
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# Création des tables au démarrage et suppression à la fermeture
# À utiliser exclusivement sur la base dédiée cinema_test
spring.jpa.hibernate.ddl-auto=create-drop

# Affichage des instructions SQL pour faciliter le diagnostic
spring.jpa.show-sql=true
